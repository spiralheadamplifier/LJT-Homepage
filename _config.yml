locale: "en-US"
site_theme: "default"
title: "Junteng Liu"
title_separator: "-"
name: &name "Junteng Liu"
description: &description "Academic portfolio of Junteng Liu, first-year PhD candidate in the HKUST NLP Group researching natural language processing and machine learning."
url: https://spiralheadamplifier.github.io
baseurl: "/LJT-Homepage"
repository: "spiralheadamplifier/LJT-Homepage"

author:
  avatar: "profile.png"
  name: "Junteng Liu"
  bio: "First-year PhD candidate in the HKUST NLP Group at the Hong Kong University of Science and Technology (HKUST). He researches natural language processing and machine learning, including LLM reasoning and reinforcement learning, hallucination in vision-language models (VLMs), and LLM truthfulness and interpretability."
  location: "Hong Kong"
  employer: "Hong Kong University of Science and Technology"
  email: "jliugi@connect.ust.hk"
  googlescholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  github: "Vicent0205"
  twitter: "junteng88716710"

publication_category:
  manuscripts:
    title: 'Preprints'
  conferences:
    title: 'Conference Papers'

og_image: og-image.png

include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .devcontainer
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - AGENTS.md
  - CHANGELOG
  - Capfile
  - config
  - docker-compose.yaml
  - docker-compose.yml
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - markdown_generator
  - node_modules
  - package.json*
  - Rakefile
  - README
  - README.md
  - scripts
  - talkmap
  - talkmap.ipynb
  - talkmap.py
  - tmp
  - vendor

kramdown:
  input: GFM
  hard_wrap: false

collections:
  publications:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Etc/UTC

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
