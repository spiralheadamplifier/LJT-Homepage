name: Validate Jekyll Build

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage" --trace
        env:
          JEKYLL_ENV: production
      - name: Show generated publications
        run: |
          echo "=== _site root ==="
          ls _site | head -40
          echo "=== _site/publications ==="
          ls -R _site/publications || true
          echo "=== publications html sanity ==="
          grep -o 'SynLogic\|Perception Bottleneck\|Truthfulness Hyperplane\|In-Context Sharpness\|C-Eval\|Parameter-Efficient' _site/publications/index.html | sort | uniq -c
