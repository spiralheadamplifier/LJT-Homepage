name: Validate Jekyll build
on:
  workflow_dispatch:
  push:
    branches: ["master"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: List generated pages
        run: |
          echo "=== _site root ==="
          ls _site/
          echo "=== publications ==="
          ls _site/publications/ || true
          echo "=== first lines of about page ==="
          head -c 600 _site/index.html || true
